openapi: 3.0.3
info:
  title: Vigie API
  version: "0.1.0"
  description: >
    Contrat REST du panneau de controle local. SOURCE DE VERITE : le front et
    tout back (Pode, Node, .NET, Go, PHP...) doivent s'y conformer. L'etat est
    une liste de "modules" generiques regroupes par "theme" ; ajouter une sonde
    n'entraine AUCUNE modification de ce contrat.
servers:
  - url: http://127.0.0.1:47600/api/v1
    description: Instance locale (ecoute strictement locale)
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Verifie que le service repond
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:  { type: string, enum: [ok] }
                  version: { type: string, description: "version LISIBLE du produit, prefixee (ex. v0.1)" }
                  build:   { type: string, description: "jeton de changement, jamais affiche : le front recharge la page quand il differe du sien" }
  /state:
    get:
      summary: Instantane complet de l'etat (tous les modules)
      parameters:
        - name: fresh
          in: query
          required: false
          description: >
            1 = recalculer toutes les sondes en ignorant le cache. Sert au bouton
            « Rafraichir » de l'interface. Sans ce parametre, la reponse peut provenir
            du cache : c'est le mode du chargement de page, qui doit etre rapide.
          schema: { type: string, enum: ["1", "true"] }
      responses:
        "200":
          description: Etat courant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }
  /modules/{id}:
    get:
      summary: Etat d'un module precis
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Module
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Module" }
        "404": { description: Module inconnu }
  /actions:
    post:
      summary: Declenche une action (synchrone ou longue)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "200":
          description: Action synchrone terminee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { description: Requete invalide }
      description: >
        Une action LONGUE renvoie elle aussi 200, avec result.async = true et
        result.module : le client suit alors ce module jusqu'a ce que son champ `busy`
        retombe a faux. Aucun code 202 n'est emis.
  # NOTE : il n'existe PAS de route /actions/{jobId}. Elle a ete decrite ici sans jamais
  # etre implementee, et retiree du contrat le 2026-08-24. Le suivi d'une action longue se
  # fait en relisant le module concerne (GET /modules/{id}) : son champ `busy` retombe a
  # faux quand la tache de fond se termine.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    State:
      type: object
      required: [generatedAt, themes, modules]
      properties:
        generatedAt: { type: string, format: date-time }
        themes:
          type: array
          items: { $ref: "#/components/schemas/Theme" }
        modules:
          type: array
          items: { $ref: "#/components/schemas/Module" }
    Theme:
      type: object
      required: [id, label]
      properties:
        id: { type: string, example: windows-update }
        label: { type: string, example: Windows Update }
        icon: { type: string, description: nom d'icone optionnel }
    Module:
      type: object
      required: [id, theme, label, status, fields, actions]
      properties:
        id: { type: string, example: wu-lock }
        theme: { type: string, example: windows-update }
        label: { type: string }
        status:
          type: string
          enum: [ok, warn, error, neutral]
          description: >
            Statut de la carte. 'neutral' = sans objet ou non evalue (ex. WSL non installe) :
            aucune couleur d'alerte. Le contrat omettait cette valeur alors que les sondes
            l'emettent et que New-ModuleObject l'accepte.
        fields:
          type: array
          items: { $ref: "#/components/schemas/Field" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/Action" }
        busyAction:
          type: string
          description: >
            Identifiant de l'action reellement en cours. Sans lui, le client anime tous les
            boutons de la carte et on ne sait plus lequel travaille.
        busy:
          type: boolean
          description: >
            Une tache de fond travaille sur ce module. Le client garde la carte en
            attente tant que ce drapeau est vrai ; sa disparition vaut fin de tache.
    Field:
      type: object
      required: [key, label, value, kind]
      properties:
        key: { type: string }
        label: { type: string }
        value: {}
        kind:
          type: string
          enum: [bool, number, text, date]
        unit: { type: string }
        status:
          type: string
          enum: [ok, warn, error, neutral]
          description: statut de ce parametre precis (pastille de couleur)
        fixAction:
          type: string
          description: id d'action a executer pour resoudre (si programmable)
        guide:
          type: string
          description: instructions manuelles (affichees en popin si pas d'action)
        table:
          type: object
          description: >
            Detail STRUCTURE, affiche en tableau dans une fenetre. A preferer a `guide`
            des que l'information est une liste : une liste mise en forme dans une chaine
            reste illisible ou qu'on l'affiche.
          properties:
            columns:
              type: array
              items: { type: string }
            rows:
              type: array
              items:
                type: array
                items: { type: string }
        help: { type: string }
    Action:
      type: object
      required: [id, label]
      properties:
        id: { type: string, example: update-mode-on }
        label: { type: string }
        confirm: { type: boolean, description: demander confirmation avant execution }
        confirmTwice:
          type: boolean
          description: >
            Exiger DEUX confirmations distinctes, la seconde nommant la consequence.
            Reserve aux gestes qui ferment le travail en cours de l'utilisateur ou
            touchent la machine entiere (redemarrage).
        help: { type: string, description: explication affichee en tooltip et dans la confirmation }
        busyLabel:
          type: string
          description: >
            Libelle affiche PENDANT l'execution -- « Mise a jour... », pas « En cours... ».
            Les points de suspension sont reserves a une action en cours ; un libelle au
            repos n'en porte jamais.
        severity:
          type: string
          enum: [neutral, info, fix]
          description: >
            Ce que l'action VAUT : neutral = sans enjeu (gris), info = consultation ou
            ouverture (bleu), fix = corrige quelque chose (vert). A ne pas confondre avec
            `kind`, qui dit COMMENT elle se passe et choisit l'icone.
        kind: { type: string, enum: [immediate, confirm, dialog, manual], description: "nature de l'action : immediate=part aussitot, confirm=oui/non, dialog=fenetre de choix dans l'app, manual=logiciel externe" }
        params:
          type: object
          additionalProperties: true
    ActionRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, example: update-mode-on }
        module: { type: string }
        params:
          type: object
          additionalProperties: true
    Job:
      type: object
      required: [jobId, status]
      properties:
        jobId: { type: string }
        status:
          type: string
          enum: [running, done, error]
        message: { type: string }
        result:
          type: object
          additionalProperties: true
          properties:
            ok:     { type: boolean, description: "echec LOGIQUE meme si HTTP 200" }
            async:  { type: boolean, description: "tache de fond lancee : suivre `module`" }
            module: { type: string,  description: "module a suivre jusqu'a busy = false" }
            choose: { type: boolean, description: "le client doit ouvrir une fenetre de choix puis rappeler `action`" }
            action: { type: string,  description: "action a rappeler avec la selection (accompagne `choose`)" }
            invalidate:
              type: array
              items: { type: string }
              description: "sondes dont le cache est invalide par cette action" 
