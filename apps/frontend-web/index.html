<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vigie</title>
<!-- Servi par la route /favicon.ico du back, qui relit le .ico LIVRE du tray :
     une seule representation de la marque, pas une copie de plus (D15). -->
<link rel="icon" href="/favicon.ico?v=__APP_BUILD__" sizes="any">
<!--
  Front statique. Ne connait QUE le contrat REST (apps/backend-pode/api/openapi.yaml).
  NE PAS ouvrir ce fichier en file:// : sans jeton d'API il n'affiche rien de reel (D47).
  Toute verification passe par le serveur -> http://127.0.0.1:47600.
  Servi par le back : le jeton est injecte dans __API_TOKEN__ (route GET / de Pode).
  Ouvert en file:// : pas de jeton -> repli sur ./mock/state.json puis mock inline.
-->
<script>
  window.API_TOKEN = "__API_TOKEN__";
  window.API_BASE  = "/api/v1";
  // Deux valeurs distinctes, deux usages : APP_VERSION s'AFFICHE (lisible, issue de git),
  // APP_BUILD sert UNIQUEMENT a detecter qu'une nouvelle version est servie. Les confondre
  // obligeait a afficher un jeton de changement -- « version 639231069781032063 ».
  window.APP_VERSION = "__APP_VERSION__";
  window.APP_BUILD   = "__APP_BUILD__";

  // ---- LES LIBELLES ---------------------------------------------------------------
  // Le texte francais ne vit plus ici : il est dans lang/fr.json, partage avec les
  // scripts PowerShell. Le serveur l'injecte a la place de ce jeton, donc les libelles
  // sont disponibles AVANT la premiere ligne de code qui affiche quoi que ce soit --
  // un fetch au demarrage ajouterait un aller-retour ET une course, ou le premier
  // rendu peut arriver avant les libelles.
  //
  // Le try/catch couvre le seul cas ou le jeton n'est pas remplace : la page ouverte
  // directement depuis le disque, sans serveur. On se replie sur les cles plutot que
  // de casser la page entiere.
  try { window.__LABELS = __LABELS_JSON__; } catch (e) { window.__LABELS = {}; }

  // L('cle', valeur, ...) : le libelle, ses trous {0} {1} remplis dans l'ordre.
  // Une cle absente rend « [?cle] » -- visible et cherchable, JAMAIS une chaine vide :
  // un message qui disparait en silence est pire que le defaut qu'on corrigeait.
  window.L = function (key) {
    var text = window.__LABELS && window.__LABELS[key];
    if (text === undefined) { return '[?' + key + ']'; }
    var vals = Array.prototype.slice.call(arguments, 1);
    return text.replace(/\{(\d+)\}/g, function (m, i) {
      return vals[+i] === undefined ? m : String(vals[+i]);
    });
  };

  // Le texte statique du HTML porte « data-i18n="cle" » ; on le remplit au chargement.
  // « data-i18n-attr="title:cle" » fait la meme chose pour un attribut.
  window.applyLabels = function (root) {
    (root || document).querySelectorAll('[data-i18n]').forEach(function (el) {
      el.textContent = window.L(el.getAttribute('data-i18n'));
    });
    (root || document).querySelectorAll('[data-i18n-attr]').forEach(function (el) {
      el.getAttribute('data-i18n-attr').split(';').forEach(function (pair) {
        var bits = pair.split(':');
        if (bits.length === 2) { el.setAttribute(bits[0].trim(), window.L(bits[1].trim())); }
      });
    });
  };
  document.addEventListener('DOMContentLoaded', function () { window.applyLabels(); });
</script>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel-2:#1c2230; --border:#2d333b;
    --text:#e6edf3; --muted:#8b949e; --accent:#388bfd;
    --ok:#3fb950; --warn:#d29922; --err:#f85149;
    --ok-bg:rgba(63,185,80,.12); --warn-bg:rgba(210,153,34,.12); --err-bg:rgba(248,81,73,.12);
    --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.4);
    /* Marque Vigie (D01) : liseré = teinte du statut assombrie (facteur 0,72) ; piste de jauge. */
    --warn-dark:#976e18; --ok-dark:#2d853a; --gauge-track:#30363d;
    --splash-fade:.45s;   /* doit rester egal a SPLASH_FADE_MS cote JS */
  }
  [data-theme="light"] {
    --bg:#e9edf4; --panel:#ffffff; --panel-2:#e6ebf2; --border:#c2cbd8;
    --text:#141a22; --muted:#586274; --accent:#0b64e6;
    --ok:#0f7a37; --warn:#9a5b00; --err:#d21c2c;
    --ok-bg:rgba(15,122,55,.16); --warn-bg:rgba(154,91,0,.17); --err-bg:rgba(210,28,44,.15);
    --shadow:0 1px 4px rgba(70,90,120,.22);
    --warn-dark:#6e4100; --ok-dark:#0a5828; --gauge-track:#c2cbd8;
  }
  *{box-sizing:border-box}
  /* Colonne pleine hauteur : le pied de page tombe EN BAS de la fenetre meme quand le
     contenu est court, au lieu de remonter coller sous la derniere carte. */
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;
       min-height:100vh;display:flex;flex-direction:column}
  /* width:100% est INDISPENSABLE : dans un conteneur flex, les marges laterales
     `auto` de main desactivent l etirement transversal. Sans cette ligne, main
     tombe a sa largeur de contenu (627 px sur 1404) et la grille perd la moitie
     de ses colonnes. */
  body > main{flex:1 0 auto;width:100%}
  header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow)}
  header .title{font-weight:700;font-size:16px} header .title small{color:var(--muted);font-weight:500;margin-left:8px}
  .global{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel-2)}
  .spacer{flex:1}
  .meta{color:var(--muted);font-size:12.5px}
  .meta.busy{color:var(--accent);font-weight:600}

  /* vi-fw : largeur FIXE (1.28em, centre), comme fa-fw - pour des boutons simples
     ou toutes les icones occupent la meme place quelle que soit leur forme. */
  /* Le centrage optique est corrige DANS la fonte (voir generate-icon-font.py) :
     aucune rustine par contexte.*/
  .vi{font-family:'Vigie Icons';font-style:normal;font-weight:400;line-height:1;
      display:inline-block;vertical-align:-0.08em;-webkit-font-smoothing:antialiased}
  /* Comme Font Awesome : vi-fw = BOITE FIXE (1.25em x 1em, centrage interne),
     vi-lg = taille relative. Declarees APRES .vi et en double classe : mesure faite,
     .vi puis .card-refresh .cr-ic ecrasaient le display et annulaient le centrage. */
  .vi.vi-fw{display:inline-flex;width:1.25em;height:1em;align-items:center;
            justify-content:center;vertical-align:-0.125em}
  .vi.vi-lg{font-size:1.25em}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);padding:7px 12px;transition:.15s}
  button:hover{border-color:var(--accent)}
  .modebar{height:3px;padding:0;border:none;position:relative;overflow:hidden}
  /* Actualisation en cours : le liseré de l'APPLICATION le montre, en gardant la couleur
     de l'etat de connexion en fond. Une barre d'etat avait ete supprimee sans que cette
     indication soit reportee ailleurs -- elle l'est ici, et dans l'en-tete en toutes lettres. */
  .modebar.busy::after{content:'';position:absolute;inset:0;width:38%;
    background:var(--accent);animation:modebar-run 1.1s ease-in-out infinite}
  @keyframes modebar-run{0%{transform:translateX(-110%)}100%{transform:translateX(370%)}}
  @media (prefers-reduced-motion:reduce){ .modebar.busy::after{animation:none;width:100%;opacity:.5} }
  .modebar.ok{background:var(--ok)}
  .modebar.warn{background:var(--warn)}
  .modebar.err{background:var(--err)}
  .modebar.neutral{background:var(--border)}
  main{max-width:1180px;margin:0 auto;padding:22px 22px 64px}
  .theme-block{margin-bottom:30px}
  .theme-head{display:flex;align-items:center;gap:10px;margin:0 4px 12px}
  .theme-head h2{font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0;font-weight:600}
  .theme-head .count{color:var(--muted);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .card-head .name{font-weight:600;font-size:15px;flex:1}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
  .badge .dot{width:8px;height:8px;border-radius:50%}
  .badge.ok{color:var(--ok);background:var(--ok-bg)} .badge.ok .dot{background:var(--ok)}
  .badge.warn{color:var(--warn);background:var(--warn-bg)} .badge.warn .dot{background:var(--warn)}
  .badge.error{color:var(--err);background:var(--err-bg)} .badge.error .dot{background:var(--err)}
  .fields{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
  .field{display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-bottom:1px dashed var(--border)}
  .field:last-child{border-bottom:none}
  .field .k{color:var(--muted)} .field .v{font-variant-numeric:tabular-nums;font-weight:600}
  .pill{padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
  .pill.yes{color:var(--ok);background:var(--ok-bg)} .pill.no{color:var(--muted);background:var(--panel-2)}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
  .actions button{font-size:13px;padding:6px 11px}
  /* z-index au-dessus du tiroir (50) et de son voile (49) : un message qui s'affiche
     DERRIERE ce qu'on regarde n'existe pas. */
  .toast-stack{position:fixed;right:18px;bottom:52px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(380px,92vw)}
  .toast{display:flex;align-items:flex-start;gap:9px;background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--muted);border-radius:10px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:13px;opacity:0;transform:translateX(14px);transition:.2s;pointer-events:auto}
  .toast.show{opacity:1;transform:none}
  .toast.done{border-left-color:var(--ok)} .toast.error{border-left-color:var(--err)} .toast.running{border-left-color:var(--accent)}
  .toast .t-body{min-width:0;flex:1} .toast .t-label{font-weight:700;display:block} .toast .t-msg{color:var(--muted);display:block;margin-top:2px;word-break:break-word}
  .toast .t-x{margin-left:4px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
  .t-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:4px;background:var(--muted)}
  .t-dot.done{background:var(--ok)} .t-dot.error{background:var(--err)} .t-dot.running{background:var(--accent)}
  /* Bouton a ICONE SEULE : le padding des boutons a texte (7px 12px) decentrait
     le glyphe. Meme boite carree que .repo-ic, contenu centre. */
  .ic-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;flex:0 0 auto}
  /* La meme apparence pour un LIEN habille en ic-btn : une ancre n'herite pas du
     style des <button> et prenait le bleu souligne des liens. */
  a.ic-btn{cursor:pointer;border-radius:8px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);text-decoration:none;transition:.15s}
  a.ic-btn:hover{border-color:var(--accent)}
  .bell{position:relative;display:inline-flex;align-items:center;justify-content:center;
        width:32px;height:32px;padding:0;flex:0 0 auto}
  .bell-count{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;line-height:1}
  .drawer-back{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.2s;z-index:49}
  .drawer-back.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(360px,92vw);background:var(--panel);border-left:1px solid var(--border);box-shadow:-12px 0 40px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .2s;z-index:50;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700}
  /* Regle commune a TOUS les tiroirs : le titre prend l espace, la croix de fermeture
     finit toujours au bord droit, avec ou sans bouton intermediaire. */
  .drawer-head > span:first-child{flex:1}
  .drawer-clear{font-size:12px;font-weight:600;color:var(--muted);background:none;border:1px solid var(--border);border-radius:8px;padding:4px 9px;cursor:pointer}
  .drawer-clear:hover{border-color:var(--accent);color:var(--text)}
  .drawer-x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
  .drawer-body{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .drawer-empty{color:var(--muted);text-align:center;padding:30px 0;font-size:13px}
  .dn{background:var(--panel-2);border:1px solid var(--border);border-left:4px solid var(--muted);border-radius:10px;padding:9px 11px;font-size:13px}
  .dn.done{border-left-color:var(--ok)} .dn.error{border-left-color:var(--err)} .dn.running{border-left-color:var(--accent)}
  .dn-head{display:flex;align-items:center;gap:8px;font-weight:600}
  .dn-del{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
  /* Verrou d'une notification d'operation en cours : on montre POURQUOI on ne peut pas
     l'effacer, au lieu de retirer le bouton sans explication. */
  .dn-lock{margin-left:auto;color:var(--accent);opacity:.75;cursor:help;font-size:13px;line-height:1}
  .dn-note{font-size:12px;line-height:1.5;color:var(--accent);background:var(--panel-2);
           border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:0 0 10px}
  /* Refus de suppression : la ligne cligne LA OU on a clique, une seule fois. */
  @keyframes dnrefus{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 2px var(--accent)}}
  .dn.refus{animation:dnrefus .5s ease}
  .dn-del:hover{color:var(--err)}
  .dn-msg{color:var(--muted);margin-top:4px;word-break:break-word}
  .dn-time{color:var(--muted);opacity:.75;font-size:11px;margin-top:3px;display:flex;align-items:center;gap:5px}
  /* Accent de statut de la CARTE : liseré à GAUCHE. A ne pas confondre avec la barre
     horizontale sous l'en-tete (.modebar), qui porte le statut de l'APPLICATION.
     Ce sont deux informations differentes, a deux endroits differents. */
  .card{border-left:4px solid var(--border)}
  .card.st-ok{border-left-color:var(--ok)}
  .card.st-warn{border-left-color:var(--warn)}
  .card.st-error{border-left-color:var(--err)}
  .badge{font-size:12.5px;padding:4px 10px}
  .badge .ic{font-weight:800;font-size:13px;line-height:1}
  /* statut par parametre (ligne) */
  .fdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--border);vertical-align:middle}
  .fdot{box-sizing:border-box}
  .fdot.ok{background:var(--ok)} .fdot.warn{background:var(--warn)} .fdot.error{background:var(--err)}
  .fdot.neutral{background:transparent;border:1.5px solid var(--muted)}
  .field .v.ok{color:var(--ok)} .field .v.warn{color:var(--warn)} .field .v.error{color:var(--err)}
  /* Le cercle est DANS le glyphe (fonte D58) : le bouton n'en dessine plus un second. */
  .fhelp{margin-left:7px;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border:none;border-radius:50%;background:none;cursor:pointer;padding:0;flex:0 0 auto}
  .fhelp svg{width:9px;height:9px;display:block}
  .fhelp:hover{color:var(--accent)}
  .fhelp.warn{color:var(--warn)} .fhelp.error{color:var(--err)}
  .field-detail{display:none;padding:0 10px 10px 28px;font-size:12.5px;color:var(--muted);border-bottom:1px dashed var(--border);overflow-wrap:anywhere;word-break:break-word}
  .field-detail.open{display:block}
  .field-detail.warn{color:var(--warn)} .field-detail.error{color:var(--err)}
  .badge.neutral{color:var(--muted);background:var(--panel-2)}
  .card.st-neutral{border-left-color:var(--muted)}
  /* panneau de suivi des actions */
  .actions-panel{position:fixed;right:18px;bottom:18px;width:340px;max-height:62vh;overflow:auto;display:flex;flex-direction:column;gap:8px;z-index:20}
  .act-panel-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:800;padding:3px 9px;align-self:flex-end;background:var(--panel-2);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow)}
  .act-item{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--muted);border-radius:10px;padding:10px 12px;box-shadow:0 8px 26px rgba(15,23,42,.38),0 0 0 1px var(--border);font-size:13px}
  .act-item.running{border-left-color:var(--accent)}
  .act-item.done{border-left-color:var(--ok)}
  .act-item.error{border-left-color:var(--err)}
  .act-head{display:flex;align-items:center;gap:8px;font-weight:600}
  .act-chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .act-chip.running{color:var(--accent);background:rgba(56,139,253,.15)}
  .act-chip.done{color:var(--ok);background:var(--ok-bg)}
  .act-chip.error{color:var(--err);background:var(--err-bg)}
  .act-msg{color:var(--muted);margin-top:5px;word-break:break-word}
  .act-close{margin-left:auto;cursor:pointer;color:var(--muted);border:none;background:none;font-size:15px;line-height:1}
  .spin{display:inline-block;width:10px;height:10px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* --- Vue dense (compacte) : beaucoup d'infos d'un coup --- */
  main{max-width:none;padding:16px 16px 60px}
  .theme-block{margin-bottom:16px}
  .theme-head{margin-bottom:8px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{padding:11px 13px}
  .card-head{margin-bottom:7px}
  .card-head .name{font-size:13.5px}
  .badge{font-size:11px;padding:2px 8px}
  .fields{margin-bottom:8px}
  .field{padding:3px 2px;font-size:12.5px}
  .fdot{width:7px;height:7px;margin-right:7px}
  .actions{gap:6px}
  .actions button{font-size:12px;padding:5px 9px}
  .field-detail{padding:0 8px 7px 24px;font-size:12px}
  /* --- Filtre rapide par groupe (chips en haut) --- */
  .filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .filterbar .flabel{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-right:2px}
  .fchip{font:inherit;cursor:pointer;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel-2);color:var(--muted);transition:.12s}
  .fchip.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .fchip:hover{border-color:var(--accent)}
  /* --- Masonry : les cartes remplissent les colonnes (plusieurs groupes possibles par colonne) --- */
  /* Chaque carte porte le nom de son groupe, et reste insecable (break-inside:avoid). */
  .loading-note{display:flex;flex-direction:column;align-items:center;gap:12px;justify-content:center;color:var(--muted);font-size:13.5px;padding:64px 0}
  .loading-note .spin{width:22px;height:22px;border-width:3px}
  /* COLONNES REELLES, pas des colonnes CSS.
     `columns: 280px` reflue TOUT ce qui suit des qu'une carte grandit : une carte qui
     passe en « operation en cours » ou une section qu'on deplie faisaient sauter les
     cartes suivantes d'une colonne a l'autre, sous les yeux. Signale le 27/08 :
     « c'est tres destabilisant ».
     Ici, chaque colonne est un vrai element et chaque carte lui appartient : une carte
     qui grandit ne pousse que ce qui est SOUS ELLE, dans SA colonne. Rien d'autre ne
     bouge. */
  /* MODE REORGANISATION (D92). Hors de ce mode, aucune carte n'est saisissable :
     l'accident est structurellement impossible, ce n'est pas une question de vigilance.
     Dedans, tout ce qui agit sur la machine est neutralise -- on range, on n'exploite
     pas. */
  body.reorg .card{cursor:grab; user-select:none}
  body.reorg .card:active{cursor:grabbing}
  body.reorg .card .actions, body.reorg .card .fsolve,
  body.reorg .card-refresh, body.reorg .card-menu{pointer-events:none; opacity:.35}
  body.reorg .card{outline:1px dashed var(--border); outline-offset:3px}
  body.reorg .card.drag{opacity:.45; outline-color:var(--accent)}
  /* Les colonnes s'etirent sur toute la hauteur : sans cela, une colonne ne mesure que
     ses cartes et le vide en dessous n'appartient a personne -- on ne pouvait pas y
     deposer (signale le 27/08). En mode rangement, la zone de depot EST la colonne. */
  body.reorg .masonry{align-items:stretch; min-height:60vh}
  body.reorg .mcol{min-height:220px}
  body.reorg .mcol::after{content:'';display:block;flex:1 1 auto;min-height:60px}
  body.reorg .mcol.cible{outline:2px dashed var(--accent); outline-offset:4px; border-radius:10px}
  .reorg-bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
             padding:10px 14px;margin:0 0 14px;border:1px solid var(--accent);
             border-radius:10px;background:var(--panel);box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .reorg-bar b{font-size:13.5px}
  .reorg-bar small{color:var(--muted);font-size:12px}
  .reorg-bar .sp{margin-left:auto;display:flex;gap:8px}
  .reorg-bar button{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:7px;cursor:pointer;
                    border:1px solid var(--border);background:none;color:var(--text)}
  .reorg-bar button.primaire{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .reorg-bar button:hover{border-color:var(--accent)}

  .masonry{display:flex;align-items:flex-start;gap:16px}
  .mcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
  .masonry .card{width:100%;margin:0}
  .card-titles{display:flex;flex-direction:column;min-width:0;flex:1}
  .card-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;line-height:1.3}
  .card-refresh{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;width:26px;height:26px;line-height:1;cursor:pointer;flex:0 0 auto;font-size:14px;padding:0}
  .card-refresh:hover{border-color:var(--accent);color:var(--text)}
  .card.card-loading{opacity:.55;pointer-events:none}
  .card-menu{font-weight:700;letter-spacing:1px}
  /* --- Tiroir de gestion des modules (D48) --- */
  .um{border:1px solid var(--border);border-radius:10px;padding:0;margin:0 0 10px;overflow:hidden}
  .um > summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;
                align-items:center;gap:10px}
  .um > summary::-webkit-details-marker{display:none}
  .um > summary::before{content:'';flex:none;width:6px;height:6px;margin-right:2px;
                        border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);
                        transform:rotate(-45deg);transition:transform .15s}
  .um[open] > summary::before{transform:rotate(45deg)}
  .um > summary:hover{background:var(--panel-2)}
  .um[open] > summary{border-bottom:1px solid var(--border)}
  .um > *:not(summary){padding-left:16px;padding-right:16px}
  /* Un bloc SANS en-tete depliable (« A propos ») n'a pas de summary pour poser sa
     marge haute : son titre collait au bord du cadre. On le rend bloc pour que la
     marge compte vraiment -- sur un <b> inline, un padding ne pousse rien. */
  .um > b:first-child{display:block;padding-top:14px;margin-bottom:2px}
  .um > *:last-child{padding-bottom:16px}
  /* Ce qui doit toucher les DEUX bords : bandes de titre et listes. Elles portent
     leur propre padding interne, ligne par ligne. */
  /* La bande de titre est pleine largeur, mais son TEXTE garde le meme retrait que
     celui des lignes (16 px) : sinon il se colle au bord, alors que tout ce qui est
     en dessous commence a 16 px. Constate a l'oeil, puis mesure : 1 px contre 17 px.
     On redonne donc les quatre cotes -- une regle qui n'annule que la gauche et la
     droite ecrasait le retrait de la forme courte. */
  .um > .um-sub{padding:13px 16px 9px}
  /* Les listes, elles, ne portent aucun retrait : ce sont leurs LIGNES qui le font,
     pour que le surlignement aille d'un bord a l'autre. */
  .um > .um-list, .um > .um-liste{padding-left:0;padding-right:0}
  .um > .um-list:last-child, .um > .um-liste:last-child, .um > .um-sub:last-child{padding-bottom:0}
  /* Une bande de titre qui suit immediatement l'en-tete depliable n'a pas besoin de
     son filet : le summary en pose deja un. */
  .um > summary + .um-sub{border-top:0}
  .um.off{opacity:.65}
  .um.flash{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .um-head{display:flex;align-items:center;gap:10px;margin:0;flex:1}
  .um-t{flex:1;min-width:0}
  .um-t b{display:block;font-size:14px}
  .um-t small{color:var(--muted);font-size:12px}
  .um-sw{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
         cursor:pointer;white-space:nowrap;padding-top:2px}
  .um-sw input{accent-color:var(--accent)}
  /* Titre de section DANS un module : discret, souligne d'un filet, aere au-dessus. */
  /* ---------------------------------------------------------------------------
     SECTIONS A PLAT (regle posee le 26/08 : « un radius dans un radius, ca ne rend
     pas bien »). Le cadre arrondi appartient au bloc PARENT, un seul niveau. Ce qui
     est dedans ne redessine ni bordure ni coin : une bande de titre, puis des lignes
     pleine largeur separees par un simple filet.

     Consequence directe et voulue : le surlignement d'une ligne va d'un bord a
     l'autre du cadre, au lieu de s'arreter avant -- ce qui donnait cette bande
     flottante, avec une marge batarde en bas.
     --------------------------------------------------------------------------- */
  .um-sub{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
          color:var(--muted);margin:0;padding:11px 16px 9px;display:flex;align-items:baseline;gap:8px;
          border-top:1px solid var(--border);background:var(--panel-2)}
  .um-cpt{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none;
          font-size:11px;color:var(--muted);opacity:.7}
  .um-list{border:0;border-radius:0;margin:0;overflow:visible}
  .um-card{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:13px;min-height:38px;
           border-bottom:1px solid var(--border);background:transparent}
  .um-card:last-child{border-bottom:none}
  .um-card:hover{background:var(--panel-2)}
  .um-card input{accent-color:var(--accent)}
  .um-card small{margin-left:auto;color:var(--muted);font-size:11px}
  .um-note{color:var(--muted);font-size:12px;line-height:1.5;margin:0;padding:10px 16px}
  .um > .um-note{padding-left:16px;padding-right:16px}
  /* Carte de reglage isolee (hors accordeon) : titre + explication a gauche,
     interrupteur a droite, toujours dans le cadre. */
  .setcard{display:flex;align-items:center;gap:14px;border:1px solid var(--border);
           border-radius:10px;padding:12px 14px;margin:0 0 4px}
  .setcard-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
  .setcard-t b{font-size:13.5px}
  .setcard-t small{color:var(--muted);font-size:12px;line-height:1.45}
  /* Liste geree en SECTION : lire, ajouter, retirer sans se battre avec une ligne. */
  .um-liste{border:0;border-radius:0;margin:0}
  .um-lrow{display:flex;align-items:center;justify-content:space-between;gap:8px;
           padding:9px 16px;font-size:13px;min-height:38px;border-bottom:1px solid var(--border)}
  .um-lrow:hover{background:var(--panel-2)}
  .um-lvide{padding:10px 16px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--border)}
  .um-ldel{font:inherit;font-size:14px;line-height:1;color:var(--muted);background:none;border:none;cursor:pointer;padding:0 4px}
  .um-ldel:hover{color:var(--err)}
  .um-ladd{display:flex;gap:6px;padding:9px 16px;background:var(--panel-2)}
  .um-ladd .um-chip-add{flex:1 1 auto;width:auto;border-radius:6px;border-style:solid}
  .um-lplus{font:inherit;font-size:12px;color:var(--text);background:none;border:1px solid var(--border);
            border-radius:6px;padding:3px 12px;cursor:pointer}
  .um-lplus:hover{border-color:var(--accent);color:var(--accent)}
  .um-points{margin:6px 0 12px;padding-left:18px;color:var(--muted);font-size:12.5px;line-height:1.65}
  .um-points li{margin:2px 0}
  .um-points b{color:var(--text);font-weight:600}
  .um-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
          border:1px solid var(--border);border-radius:999px;padding:1px 6px;margin-left:4px}
  .um-mut{font-size:11.5px;color:var(--muted)}
  .um-hint{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 12px}
  /* Parametres : tiroir LARGE, navigation verticale a gauche (elle ne casse jamais a
     la ligne et accueille autant de sections qu'il faudra), contenu a droite. */
  #settingsDrawer{width:min(920px,96vw)}
  #settingsDrawer .drawer-body{padding:0;overflow:hidden;flex-direction:row;gap:0;flex:1;min-height:0}
  .set-wrap{display:flex;flex:1;min-height:0;width:100%}
  .set-nav{flex:0 0 190px;border-right:1px solid var(--border);padding:12px 10px;
           display:flex;flex-direction:column;gap:3px;overflow-y:auto}
  .set-item{display:flex;align-items:center;gap:10px;text-align:left;font-size:13.5px;
            font-weight:600;color:var(--muted);background:none;border:none;
            border-radius:8px;padding:10px 12px;cursor:pointer;white-space:nowrap}
  .set-item:hover{background:var(--panel-2);color:var(--text)}
  .set-item.on{background:var(--panel-2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
  /* La boite de l'icone CENTRE son contenu au lieu de le poser sur une ligne de
     texte. Avec text-align seul, l'icone (inline-flex, avec son propre
     vertical-align) retombait sur la baseline du libelle : les cinq icones ne
     partageaient donc ni le meme axe vertical, ni la meme colonne -- d'autant que
     celle d'« A propos » est plus grande que les autres. */
  .set-ic{flex:0 0 18px;width:18px;min-width:0;height:1.25em;display:flex;align-items:center;justify-content:center}
  .set-ic .vi{vertical-align:0}
  /* i cercle en POLICE + CSS (regle du projet : icones a partir d'une font). */
  .ic-round{width:15px;height:15px;border:1.5px solid currentColor;border-radius:50%;
            display:inline-flex;align-items:center;justify-content:center;
            font-size:10px;font-weight:700;line-height:1}
  /* ---------------------------------------------------------------------------
     RYTHME VERTICAL : c'est le CONTENEUR qui espace, pas les composants.
     Chaque fois qu'un bloc etait ajoute dans un panneau, il fallait penser a sa marge
     -- et on l'oubliait (constate deux fois le 27/08 : titre colle au cadre, puis
     bloc « Disposition des cartes » colle a la grille des themes). Une regle de flux
     ici, et tout element ajoute demain est espace sans qu'on ait a y penser.
     --------------------------------------------------------------------------- */
  .set-pane{flex:1;min-width:0;overflow-y:auto;padding:16px 18px}
  .set-pane > * + *{margin-top:14px}
  /* Les composants n'apportent plus leur propre marge basse dans ce flux : deux
     sources d'espacement donnaient des ecarts inegaux d'un panneau a l'autre. */
  .set-pane > *{margin-bottom:0}
  @media (max-width:560px){
    .set-wrap{flex-direction:column}
    .set-nav{flex:0 0 auto;flex-direction:row;border-right:none;border-bottom:1px solid var(--border);overflow-x:auto}
    .set-pane{padding:12px 14px}
  }
  .apropos-repo{display:inline-flex;align-items:center;gap:8px;color:var(--text);
                text-decoration:none;font-size:13px;border:1px solid var(--border);
                border-radius:8px;padding:7px 12px}
  .apropos-repo:hover{border-color:var(--accent)}
  /* Apparence : cartes-radio de themes. La coche native est masquee, la carte entiere
     est le controle ; d'autres themes s'ajoutent en une entree de la liste THEMES. */
  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .theme-opt{border:2px solid var(--border);border-radius:11px;padding:10px;cursor:pointer;
             display:flex;flex-direction:column;gap:8px;align-items:stretch}
  .theme-opt:hover{border-color:var(--accent)}
  .theme-opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .theme-opt input{position:absolute;opacity:0;pointer-events:none}
  .theme-prev{display:flex;align-items:center;justify-content:center;border-radius:8px;
              height:64px;border:1px solid var(--border)}
  .theme-prev-card{border-radius:6px;padding:8px 14px;font-weight:700;font-size:14px;
                   box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .theme-nom{font-size:12.5px;font-weight:600;text-align:center}
  .um-param{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;
            color:var(--muted);cursor:pointer;white-space:nowrap}
  /* Interrupteur : la case native est masquee, le rail/bouton sont dessines en CSS.
     Un seul composant pour tous les reglages on/off (Actif, notification, global). */
  .swx{position:relative;display:inline-block;width:32px;height:18px;flex:0 0 auto}
  .swx input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .swx i{position:absolute;inset:0;border-radius:999px;background:var(--border);
         transition:background .15s;pointer-events:none}
  .swx i::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;
         border-radius:50%;background:var(--text);transition:transform .15s}
  .swx input:checked + i{background:var(--accent)}
  .swx input:checked + i::after{transform:translateX(14px);background:#fff}
  .swx input:disabled + i{opacity:.5}
  .um-num{width:64px;font:inherit;font-size:12.5px;color:var(--text);background:var(--panel-2);
          border:1px solid var(--border);border-radius:6px;padding:3px 6px;text-align:right}
  .um-num:focus{outline:none;border-color:var(--accent)}
  .um-reset{font:inherit;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
            color:var(--muted);background:none;border:1px dashed var(--border);border-radius:6px;
            padding:2px 7px;cursor:pointer}
  .um-reset:hover{color:var(--text);border-color:var(--accent)}
  .apropos-l{display:flex;justify-content:space-between;gap:12px;font-size:13px;
             padding:6px 0;border-bottom:1px dashed var(--border)}
  .apropos-l span{color:var(--muted)}
  .card.card-loading .card-refresh .cr-ic{animation:sp .7s linear infinite}
  /* --- Parametres : label a gauche, valeur coloree en face (dessous si longue, alignee a droite) --- */
  .fields{margin-bottom:8px}
  .frow{padding:4px 2px;border-bottom:1px dashed var(--border)}
  .frow:last-child{border-bottom:none}
  .field{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;font-size:13px}
  .field .k{color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
  .field .v{font-weight:700;margin-left:auto;text-align:right;word-break:break-word}
  .fk-label.clickable{cursor:pointer}
  .fk-label.clickable:hover{color:var(--text);text-decoration:underline dotted}
  .v-ok{color:var(--ok)} .v-warn{color:var(--warn)} .v-error{color:var(--err)} .v-neutral{color:var(--text)}
  .frow-actions{padding:3px 0 2px 22px}
  /* Le passage d'un etat a un autre, dans une confirmation : deux valeurs, une fleche. */
  .cf-trans{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:2px}
  .cf-v{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
        padding:6px 12px;font-weight:600;font-size:13px;line-height:1.25}
  .cf-v-to{border-color:var(--accent);color:var(--accent)}
  .cf-vn{font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
  .cf-fl{color:var(--muted);font-size:16px;line-height:1}
  /* Le deroule : des pastilles numerotees, la derniere marquee comme l'arrivee. */
  .cf-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
  .cf-step{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
  .cf-dot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
          border-radius:50%;border:1px solid var(--border);background:var(--panel-2);
          font-size:11px;font-weight:600;flex:0 0 auto}
  .cf-step-fin{color:var(--ok);font-weight:600}
  .cf-step-fin .cf-dot{border-color:var(--ok);color:var(--ok)}
  .cf-sep{color:var(--muted);font-size:13px}
  .fsolve{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;border:1px solid currentColor;background:none;cursor:pointer}
  .fsolve svg{width:11px;height:11px;flex:0 0 auto}
  /* L'icone du bouton Resoudre se fond dans la couleur du texte (le type reste indique par la FORME) */
  .fsolve svg{color:currentColor}

  .fsolve:hover{background:rgba(127,127,127,.14)}
  /* DESACTIVE : ca se VOIT, et ca ne reagit plus. Un bouton bloque par une operation en
     cours gardait son survol et sa couleur pleine : rien ne disait qu'il etait mort
     (signale le 28/08). Le sablier, lui, est reserve au bouton de l'operation -- c'est
     la regle « .busy l'emporte », juste en dessous. */
  .act:disabled,.fsolve:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(1)}
  /* RETENU N'EST PAS INTERDIT. Un bouton bloque le temps d'une operation qui se passe
     AILLEURS avait exactement l'aspect d'un bouton refuse par les droits : la carte
     semblait en panne (signale le 28/08, carte Comptes pendant un deploiement). Il
     reste desactive -- c'est bien le but -- mais il se lit comme une attente. */
  .act.retenu:disabled,.fsolve.retenu:disabled{opacity:.62;cursor:progress;filter:grayscale(.35)}
  .act:disabled:hover,.fsolve:disabled:hover{background:none}
  /* Etat "action en cours" sur un bouton : il tourne, donc il n'est pas grise. */
  .act.busy,.fsolve.busy{opacity:.9;cursor:progress;filter:none}
  .act.busy:disabled,.fsolve.busy:disabled{opacity:.9;cursor:progress;filter:none}
  /* « En cours » est un ETAT de la carte : il s'exprime donc dans le MEME liséré que le
     statut, et non dans un halo separe. Un halo autour de la carte dissociait deux
     informations qui parlent de la meme chose, et se lisait comme une alerte. */
  .card.busy{border-left-color:var(--accent);animation:cardbusy 1.6s ease-in-out infinite}
  @keyframes cardbusy{0%,100%{border-left-color:var(--accent)}50%{border-left-color:var(--border)}}
  @media (prefers-reduced-motion:reduce){ .card.busy{animation:none} }
  .act.busy .spin,.fsolve.busy .spin{border-color:currentColor;border-top-color:transparent;vertical-align:-1px;margin-right:5px}
  .frow .field-detail{display:none;margin-top:2px;padding:0 2px 4px 22px;border:none;font-size:12px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere;word-break:break-word}
  .frow .field-detail.open{display:block}
  .frow .field-detail.warn{color:var(--warn)} .frow .field-detail.error{color:var(--err)}
  /* icones par type d'action */
  .actions button.act{display:inline-flex;align-items:center;gap:6px}
  /* Action refusee a ce compte Windows (D65) : lisible, inerte, et le curseur dit qu'il y
     a une explication au survol -- on ne la retire pas de la carte. */
  .actions button.act.denied{opacity:.45;cursor:help;border-style:dashed}
  .actions button.act svg{flex:none}
  /* SEVERITE = ce que l'action vaut ; TYPE = comment elle se passe (l'icone).
     Les deux etaient confondus : la couleur suivait la forme, ce qui n'apprenait rien.

     Deux traitements, selon la place du bouton :
     - action PRINCIPALE (barre d'actions) : bouton NEUTRE au repos, il prend sa couleur
       au SURVOL. Une barre entierement coloree crie autant qu'elle informe ;
     - bouton de RESOLUTION (dans la ligne du champ) : colore en permanence, c'est un
       correctif propose sur un defaut, il doit se remarquer.
     Dans les deux cas, l'ICONE porte toujours la couleur de la severite. */
  .act.sev-neutral svg{color:var(--muted)}
  .act.sev-info    svg{color:var(--accent)}
  .act.sev-fix     svg{color:var(--ok)}
  .act.sev-info:hover{color:var(--accent);border-color:var(--accent)}
  .act.sev-fix:hover{color:var(--ok);border-color:var(--ok)}
  .act.sev-neutral:hover{color:var(--muted);border-color:var(--muted)}

  .fsolve.denied{opacity:.45;cursor:help;border-style:dashed}
  .fsolve.sev-neutral{color:var(--muted);border-color:var(--muted)}
  .fsolve.sev-info{color:var(--accent);border-color:var(--accent)}
  .fsolve.sev-fix{color:var(--ok);border-color:var(--ok)}
  .k-manual{border-style:dashed}
  /* ===== Design system : Dialog (modale in-app reutilisable) ===== */
  .hds-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(2px)}
  .hds-back.show{display:flex;animation:hds-fade .12s ease}
  /* Emplacement HAUT : reserve a la seconde confirmation d'une action critique. Les deux
     fenetres ne doivent jamais se superposer, sinon un double clic rapide les valide
     toutes les deux sans qu'aucune ait ete lue. */
  .hds-back.haut{align-items:flex-start;padding-top:7vh}
  /* Alerte d'action critique : en gras, pleine largeur, impossible a manquer.
     Orange a la premiere confirmation, rouge a la seconde. */
  .hds-alerte{display:flex;align-items:flex-start;gap:9px;font-weight:700;line-height:1.45;
              border-radius:9px;padding:11px 13px;margin:0 0 14px}
  .hds-alerte .ic{font-weight:800;flex:0 0 auto}
  .hds-alerte.warn{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn)}
  .hds-alerte.danger{color:var(--err);background:var(--err-bg);border:1px solid var(--err)}
  @keyframes hds-fade{from{opacity:0}to{opacity:1}}
  .hds-dialog{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:520px;width:100%;box-shadow:0 12px 44px rgba(0,0,0,.55);animation:hds-pop .14s ease}
  @keyframes hds-pop{from{transform:translateY(6px) scale(.98);opacity:.5}to{transform:none;opacity:1}}
  .hds-dialog-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700}
  .hds-dialog-ic{width:22px;height:22px;flex:0 0 auto;display:none;align-items:center;justify-content:center;border-radius:50%;font-size:13px;font-weight:800}
  .hds-dialog.has-ic .hds-dialog-ic{display:inline-flex}
  .hds-dialog--warn .hds-dialog-ic{color:var(--warn);background:var(--warn-bg)}
  .hds-dialog--danger .hds-dialog-ic{color:var(--err);background:var(--err-bg)}
  .hds-dialog--info .hds-dialog-ic{color:var(--accent);background:rgba(56,139,253,.14)}
  .hds-x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
  .hds-dialog-body{padding:16px;white-space:pre-line;line-height:1.55;max-height:60vh;overflow:auto}
  .hds-intro{margin:0 0 10px;color:var(--muted)}
  .hds-choice-bar{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:12.5px}
  .hds-lnk{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
  .hds-count{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
  /* Arborescence du disque (S13b) : une ligne = un dossier, sa taille, sa part. */
  .tree-root{font-size:12.5px}
  .tree-node>summary{display:flex;align-items:center;gap:8px;padding:4px 2px;cursor:pointer;
                     border-bottom:1px solid var(--border);list-style:none}
  .tree-node>summary::-webkit-details-marker{display:none}
  .tree-node>summary::before{content:'';flex:none;width:5px;height:5px;margin-right:4px;
                             border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);
                             transform:rotate(-45deg);transition:transform .15s}
  .tree-node[open]>summary::before{transform:rotate(45deg)}
  .tree-kids{margin-left:14px;border-left:1px solid var(--border);padding-left:8px}
  .tree-leaf{display:flex;align-items:center;gap:8px;padding:4px 2px 4px 16px;border-bottom:1px solid var(--border)}
  .tree-n{flex:1 1 auto;word-break:break-word}
  .tree-s{flex:none;font-variant-numeric:tabular-nums;color:var(--text)}
  .tree-p{flex:none;width:52px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .tree-file{color:var(--muted)}
  .tree-mut{color:var(--muted);font-style:italic}
  .tree-attente{padding:6px 16px;color:var(--muted);font-size:12px}
  .tree-open{flex:none;font:inherit;font-size:12px;line-height:1;color:var(--muted);background:none;
             border:1px solid var(--border);border-radius:6px;padding:2px 6px;cursor:pointer}
  .tree-open:hover{color:var(--accent);border-color:var(--accent)}
  /* Une ligne de choix = la case a cocher + son bouton « Ignorer » (D69). */
  .hds-choice-row{display:flex;align-items:center;gap:8px}
  .hds-choice-row .hds-choice{flex:1 1 auto}
  .hds-exclu{flex:none;font:inherit;font-size:11.5px;color:var(--muted);background:none;
             border:1px solid var(--border);border-radius:6px;padding:2px 9px;cursor:pointer}
  .hds-exclu:hover{color:var(--err);border-color:var(--err)}
  .hds-exclu:disabled{opacity:.5;cursor:progress}
  .hds-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .hds-table th{text-align:left;font-weight:700;color:var(--muted);text-transform:uppercase;
                letter-spacing:.5px;font-size:11px;padding:6px 10px 6px 0;border-bottom:1px solid var(--border);
                position:sticky;top:0;background:var(--panel)}
  .hds-table td{padding:6px 10px 6px 0;border-bottom:1px solid var(--border);vertical-align:top;
                word-break:break-word}
  .hds-table tr:last-child td{border-bottom:none}
  /* Une ligne qui porte une infobulle le dit : sans repere visuel, personne ne survole. */
  .hds-table tr[title]{cursor:help}
  .hds-table tr[title]:hover td{background:var(--panel-2)}
  .hds-table td:nth-child(n+3){font-variant-numeric:tabular-nums;white-space:nowrap}
  .hds-loading{display:flex;align-items:center;gap:9px;color:var(--muted);padding:14px 2px}
  /* Confirmation EXPLICITE (D91) : des blocs titres plutot qu'un paragraphe. On lit
     « ce que ca change » avant de dire oui, pas apres. */
  .cf-bloc{margin:0 0 10px}
  .cf-bloc:last-child{margin-bottom:0}
  .cf-t{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
        color:var(--muted);margin-bottom:2px}
  .cf-c{font-size:13px;line-height:1.5}
  .hds-choices{display:flex;flex-direction:column;gap:2px}
  .hds-choice{display:grid;grid-template-columns:auto 1fr;gap:4px 9px;align-items:start;
              padding:7px 8px;border-radius:8px;cursor:pointer}
  .hds-choice:hover{background:var(--panel-2)}
  .hds-choice input{margin-top:3px;accent-color:var(--accent)}
  .hds-choice--fige{cursor:default;pointer-events:none}
  .hds-choice--fige:hover{background:transparent}
  .hds-choice-t{white-space:normal;word-break:break-word}
  .hds-choice-d{grid-column:2;color:var(--muted);font-size:12px}
  .hds-btn:disabled{opacity:.45;cursor:not-allowed}
  .hds-dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
  .hds-dialog-foot:empty{display:none}
  /* Boutons reutilisables */
  .hds-btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);padding:8px 16px;font-weight:600;transition:.15s}
  .hds-btn:hover{border-color:var(--accent)}
  .hds-btn--primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .hds-btn--primary:hover{filter:brightness(1.08)}
  .hds-btn--danger{background:var(--err);border-color:var(--err);color:#fff}
  .hds-btn--danger:hover{filter:brightness(1.08)}
  .hds-btn--ghost{background:transparent}
  .hds-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ================= Ecran de chargement (D08) =================
     Present dans le HTML statique : visible avant meme l'execution du JS.
     S'efface des le premier chargement (reussi ou en erreur : l'erreur doit rester lisible). */
  #splash{position:fixed;inset:0;z-index:9999;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
    transition:opacity var(--splash-fade,.45s) ease}
  #splash.splash-off{opacity:0;pointer-events:none}
  #splash[hidden]{display:none}
  .splash-mark{width:104px;height:104px;display:block}
  /* La jauge monte AVEC le chargement. Tant que la progression est inconnue, elle monte
     d'un CRAN a la fois -- les 7 graduations de D01, donc 6 intervalles -- puis repart de
     zero. Un balayage continu se lirait comme une progression reelle qu'on ne mesure pas.
     L'animation va jusqu'a 315deg (7 crans) pour que steps(7,end) affiche bien la position
     pleine 270deg : avec 270deg, le dernier cran ne serait jamais atteint. */
  .splash-arc-val{stroke-dasharray:164.93;stroke-dashoffset:164.93;
    animation:splash-fill 2.8s steps(7,end) infinite}
  .splash-needle{transform-origin:50px 50px;animation:splash-sweep 2.8s steps(7,end) infinite}
  @keyframes splash-fill{from{stroke-dashoffset:164.93}to{stroke-dashoffset:-27.49}}
  @keyframes splash-sweep{from{transform:rotate(0deg)}to{transform:rotate(315deg)}}
  /* Progression CONNUE : le JS pose --splash-frac et coupe la boucle. */
  #splash.splash-determine .splash-arc-val{animation:none;
    stroke-dashoffset:calc(164.93 - 164.93 * var(--splash-frac,0))}
  #splash.splash-determine .splash-needle{animation:none;
    transform:rotate(calc(270deg * var(--splash-frac,0)))}
  .splash-id{display:flex;flex-direction:column;align-items:center;gap:16px}
  /* line-height 1 coupait la boite au ras de la ligne de base : la jambe du « g » plongeait
     dans la gouttiere de 6 px et le sous-titre paraissait colle. */
  .splash-name{font-size:clamp(54px,11vw,88px);font-weight:700;letter-spacing:-.035em;line-height:1.1;margin:0}
  .splash-sub{color:var(--muted);font-size:13.5px;letter-spacing:.4px;margin:0}
  .splash-bar{width:186px;height:3px;border-radius:999px;background:var(--border);overflow:hidden}
  .splash-bar i{display:block;width:38%;height:100%;border-radius:inherit;background:var(--accent);
    animation:splash-slide 1.25s ease-in-out infinite}
  @keyframes splash-slide{0%{transform:translateX(-110%)}100%{transform:translateX(370%)}}
  .splash-foot{position:absolute;bottom:26px;margin:0;font-size:12.5px}
  @media (prefers-reduced-motion:reduce){
    #splash{transition:none}
    .splash-arc-val{animation:none;stroke-dashoffset:82.47}
    .splash-needle{animation:none;transform:rotate(135deg)}
    .splash-bar i{animation:none;width:100%}
  }
  /* ================= Lien vers le depot (D09) ================= */
  .svg-sprite{position:absolute;width:0;height:0;overflow:hidden}
  .repo-link{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;transition:.15s}
  .repo-link:hover{color:var(--text);border-bottom-color:var(--border)}
  .repo-ic{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;
    border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--muted);
    text-decoration:none;flex:0 0 auto;transition:.15s}
  .repo-ic:hover{border-color:var(--accent);color:var(--text)}
  .appfoot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);
    border-top:1px solid var(--border);padding:7px 22px;display:flex;align-items:center;gap:10px;
    color:var(--muted);font-size:12.5px}
  .appfoot .sep{opacity:.5}
</style>
</head>
<body>
<!-- Marque GitHub definie UNE fois, reutilisee par <use>. Elle apparaissait a trois
     endroits : trois copies d'un meme trace finissent toujours par diverger (D15). -->
<svg class="svg-sprite" aria-hidden="true"><symbol id="ghMark" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38l-.01-1.34c-2.23.48-2.7-1.07-2.7-1.07-.36-.93-.89-1.18-.89-1.18-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.23 1.88.87 2.34.67.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.22 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0z"/></symbol></svg>
<!-- ================= Ecran de chargement (D08) =================
     Marque "icone tray v1 - jauge a graduations" (D01), etat "demarrage" (orange, fraction 0,50).
     Geometrie identique a apps/tray/assets/generate-icons.py, en fractions d'une taille de 100. -->
<div id="splash" role="status" aria-live="polite" aria-label="Chargement de Vigie" data-i18n-attr="aria-label:ui.chargement-de-vigie">
  <svg class="splash-mark" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <!-- Piste et arc de valeur partagent exactement le meme trace. -->
      <path id="gaugeArc" d="M 25.251 74.749 A 35 35 0 1 1 74.749 74.749"/>
    </defs>
    <circle cx="50" cy="50" r="45" fill="none" stroke="var(--ok)" stroke-opacity=".35" stroke-width="2.4"/>
    <use href="#gaugeArc" fill="none" stroke="var(--gauge-track)" stroke-width="11" stroke-linecap="round"/>
    <g stroke="var(--muted)" stroke-opacity=".35" stroke-width="2">
        <line x1="25.746" y1="74.254" x2="30.201" y2="69.799"/>
        <line x1="15.700" y1="50.000" x2="22.000" y2="50.000"/>
        <line x1="25.746" y1="25.746" x2="30.201" y2="30.201"/>
        <line x1="50.000" y1="15.700" x2="50.000" y2="22.000"/>
        <line x1="74.254" y1="25.746" x2="69.799" y2="30.201"/>
        <line x1="84.300" y1="50.000" x2="78.000" y2="50.000"/>
        <line x1="74.254" y1="74.254" x2="69.799" y2="69.799"/>
    </g>
    <use class="splash-arc-val" href="#gaugeArc" fill="none" stroke="var(--ok)" stroke-width="11" stroke-linecap="round"/>
    <g class="splash-needle" stroke-linecap="round">
      <line x1="54.243" y1="45.757" x2="27.231" y2="72.769" stroke="var(--ok-dark)" stroke-opacity=".95" stroke-width="9.8"/>
      <line x1="54.243" y1="45.757" x2="27.231" y2="72.769" stroke="var(--ok)" stroke-width="8.2"/>
    </g>
    <circle cx="50" cy="50" r="9.5" fill="var(--ok)"/>
    <circle cx="50" cy="50" r="4.2" fill="#f0f6fc"/>
  </svg>
  <div class="splash-id">
    <p class="splash-name">Vigie</p>
    <p class="splash-sub" id="splashSub" data-i18n="ui.tableau-de-bord-local">Tableau de bord local</p>
  </div>
  <div class="splash-bar"><i></i></div>
  <p class="splash-foot"><a class="repo-ic" data-repo-link aria-label="Depot du projet sur GitHub" data-i18n-attr="aria-label:ui.depot-du-projet-sur"><svg width="16" height="16" aria-hidden="true"><use href="#ghMark"/></svg></a></p>
</div>
<header>
  <div class="title"><span id="appTitle">…</span> <small>Vigie</small></div>
  <div class="global" id="global"><span class="dot"></span><span id="globalTxt">—</span></div>
