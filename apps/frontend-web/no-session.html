<!doctype html>
<!-- @author Florent HAZARD <f.hazard@sowapps.com> -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigie</title>
<!--
  THE PAGE SERVED WHEN VIGIE DOES NOT KNOW WHO IS LOOKING.

  It holds NO state, NO token, NO list of cards: that is the whole point of it. Nor does
  it say what exactly is missing -- "open Vigie from its icon" is enough for whoever has
  the right to be here, and teaches the others nothing.

  An administrator can choose the other behaviour in Settings > Users.
-->
<style>
  :root{ --bg:#0d1117; --panel:#161b22; --text:#e6edf3; --muted:#8b949e; --err:#f85149; --border:#30363d }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--text);
       font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  .box{max-width:440px;padding:40px 34px;text-align:center}
  svg{width:84px;height:84px;margin-bottom:22px}
  h1{font-size:44px;font-weight:700;letter-spacing:-.03em;margin:0 0 6px}
  p{color:var(--muted);font-size:14.5px;line-height:1.65;margin:0 0 10px}
  .hint{margin-top:26px;padding:14px 16px;border:1px solid var(--border);border-radius:10px;
        background:var(--panel);font-size:13.5px}
</style>
</head>
<body>
  <div class="box">
    <!-- THE MARK, IN ITS ERROR STATE. The same geometry as everywhere else (D01) and the same
         values as the error.ico icon: colour #f85149, gauge at 17 % -- that is a needle
         at 0.17 x 270 degrees. A page that refuses must be recognisable at a glance. -->
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><path id="arc" d="M 25.251 74.749 A 35 35 0 1 1 74.749 74.749"/></defs>
      <circle cx="50" cy="50" r="45" fill="none" stroke="var(--err)" stroke-opacity=".35" stroke-width="2.4"/>
      <use href="#arc" fill="none" stroke="#30363d" stroke-width="11" stroke-linecap="round"/>
      <g stroke="var(--muted)" stroke-opacity=".35" stroke-width="2">
        <line x1="25.746" y1="74.254" x2="30.201" y2="69.799"/>
        <line x1="15.700" y1="50.000" x2="22.000" y2="50.000"/>
        <line x1="25.746" y1="25.746" x2="30.201" y2="30.201"/>
        <line x1="50.000" y1="15.700" x2="50.000" y2="22.000"/>
        <line x1="74.254" y1="25.746" x2="69.799" y2="30.201"/>
        <line x1="84.300" y1="50.000" x2="78.000" y2="50.000"/>
        <line x1="74.254" y1="74.254" x2="69.799" y2="69.799"/>
      </g>
      <use href="#arc" fill="none" stroke="var(--err)" stroke-width="11" stroke-linecap="round"
           stroke-dasharray="164.93" stroke-dashoffset="136.89"/>
      <g transform="rotate(45.9 50 50)" stroke-linecap="round">
        <line x1="54.243" y1="45.757" x2="27.231" y2="72.769" stroke="#8b1f1a" stroke-opacity=".95" stroke-width="9.8"/>
        <line x1="54.243" y1="45.757" x2="27.231" y2="72.769" stroke="var(--err)" stroke-width="8.2"/>
      </g>
      <circle cx="50" cy="50" r="9.5" fill="var(--err)"/>
      <circle cx="50" cy="50" r="4.2" fill="#f0f6fc"/>
    </svg>
    <h1>Vigie</h1>
    <p>Cette fenêtre n'est associée à aucun compte de cet ordinateur.</p>
    <div class="hint">Vigie s'ouvre depuis son icône, dans la zone de notification.</div>
  </div>
</body>
</html>
